[project]
name = "tickline-widget"
version = "0.1.0"
description = "TickLine (KLineChart) backtest chart for Jupyter — candles, trade markers, position boxes, bar replay."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anywidget>=0.9",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tickline_widget"]
# static/widget.js is generated by `npm run build` in the TickLine root — make sure
# it exists before building a wheel.
artifacts = ["tickline_widget/static/widget.js"]
